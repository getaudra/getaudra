<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">AUDRA command center full system</title><desc id="desc">A dark operations console with emerald telemetry, system status, and a routed signal line.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#050d12"/><stop offset=".6" stop-color="#0a1e1b"/><stop offset="1" stop-color="#102d2d"/></linearGradient><linearGradient id="sig"><stop stop-color="#55f0bc"/><stop offset="1" stop-color="#6bbcff"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <rect width="1200" height="430" rx="24" fill="url(#bg)"/><g opacity=".16" stroke="#77e8c4"><path d="M0 86h1200M0 172h1200M0 258h1200M0 344h1200M120 0v430M240 0v430M360 0v430M480 0v430M600 0v430M720 0v430M840 0v430M960 0v430M1080 0v430"/></g>
  <rect x="50" y="42" width="1100" height="346" rx="14" fill="none" stroke="#2f8f78" stroke-width="2"/>
  <path id="signal-path" d="M78 306h390l70-112h190l88 70h290" fill="none" stroke="url(#sig)" stroke-width="3" filter="url(#g)"><animate attributeName="opacity" values=".72;1;.72" dur="3.8s" repeatCount="indefinite"/></path>
  <circle r="7" fill="#d9fff2" filter="url(#g)"><animateMotion dur="5.5s" repeatCount="indefinite" path="M78 306h390l70-112h190l88 70h290"/></circle>
  <g fill="#7fffd0" filter="url(#g)"><circle cx="78" cy="306" r="6"><animate attributeName="r" values="5;8;5" dur="2.8s" repeatCount="indefinite"/></circle><circle cx="538" cy="194" r="6"><animate attributeName="r" values="5;8;5" dur="2.8s" begin=".4s" repeatCount="indefinite"/></circle><circle cx="816" cy="264" r="6"><animate attributeName="r" values="5;8;5" dur="2.8s" begin=".8s" repeatCount="indefinite"/></circle><circle cx="1106" cy="264" r="6"><animate attributeName="r" values="5;8;5" dur="2.8s" begin="1.2s" repeatCount="indefinite"/></circle></g>
  <g fill="#64e6bc" font-family="monospace"><text x="84" y="88" font-size="18" letter-spacing="3">AUDRA / COMMAND CENTER</text><text x="80" y="184" fill="#effff9" font-family="Arial,sans-serif" font-size="78" font-weight="700" letter-spacing="10">SYSTEMS ONLINE</text><text x="86" y="232" font-size="19">STATUS : RESEARCH ACTIVE</text><text x="86" y="263" font-size="19">MODE   : OBSERVE → TEST → ITERATE</text><text x="86" y="294" font-size="19">SIGNAL : EVIDENCE BEFORE CONFIDENCE</text><text x="86" y="356" fill="#ffcf72" font-size="15" letter-spacing="2">BUILD MODE: CONTINUOUS   //   DOMAIN: AI · SOFTWARE · RESEARCH · AUTOMATION</text></g>
  <g fill="#ffcf72"><circle cx="1072" cy="83" r="7"><animate attributeName="opacity" values="1;.45;1" dur="2.4s" repeatCount="indefinite"/></circle><circle cx="1096" cy="83" r="7"><animate attributeName="opacity" values="1;.45;1" dur="2.4s" begin=".35s" repeatCount="indefinite"/></circle><circle cx="1120" cy="83" r="7"><animate attributeName="opacity" values="1;.45;1" dur="2.4s" begin=".7s" repeatCount="indefinite"/></circle></g>
</svg>
