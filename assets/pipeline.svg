<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 180" role="img" aria-labelledby="title desc">
  <title id="title">Audra research pipeline</title>
  <desc id="desc">A staged pipeline from idea to ship with a restrained sequential energy-flow animation.</desc>
  <defs>
    <linearGradient id="energy" x2="1"><stop stop-color="#39d8a2" stop-opacity=".34"/><stop offset=".78" stop-color="#73f4c8" stop-opacity=".72"/><stop offset="1" stop-color="#ffdf86" stop-opacity=".92"/></linearGradient>
    <clipPath id="box-idea"><rect x="24" y="64" width="118" height="52" rx="8"/></clipPath><clipPath id="box-research"><rect x="170" y="64" width="118" height="52" rx="8"/></clipPath><clipPath id="box-prototype"><rect x="316" y="64" width="118" height="52" rx="8"/></clipPath><clipPath id="box-test"><rect x="462" y="64" width="118" height="52" rx="8"/></clipPath><clipPath id="box-falsify"><rect x="608" y="64" width="118" height="52" rx="8"/></clipPath><clipPath id="box-iterate"><rect x="754" y="64" width="118" height="52" rx="8"/></clipPath>
  </defs>
  <rect width="1000" height="180" rx="18" fill="#07100f"/>
  <g fill="#d8fff1" font-family="monospace" font-size="15" text-anchor="middle">
    <g fill="#12372f" stroke="#39d7a2"><rect x="24" y="64" width="118" height="52" rx="8"/><rect x="170" y="64" width="118" height="52" rx="8"/><rect x="316" y="64" width="118" height="52" rx="8"/><rect x="462" y="64" width="118" height="52" rx="8"/><rect x="608" y="64" width="118" height="52" rx="8"/><rect x="754" y="64" width="118" height="52" rx="8"/></g>
    <g fill="url(#energy)" opacity=".9"><rect x="24" y="64" width="0" height="52" clip-path="url(#box-idea)"><animate attributeName="width" values="0;118;118;0" keyTimes="0;.075;.90;1" dur="10s" repeatCount="indefinite"/></rect><rect x="170" y="64" width="0" height="52" clip-path="url(#box-research)"><animate attributeName="width" values="0;0;118;118;0" keyTimes="0;.125;.20;.90;1" dur="10s" repeatCount="indefinite"/></rect><rect x="316" y="64" width="0" height="52" clip-path="url(#box-prototype)"><animate attributeName="width" values="0;0;118;118;0" keyTimes="0;.25;.325;.90;1" dur="10s" repeatCount="indefinite"/></rect><rect x="462" y="64" width="0" height="52" clip-path="url(#box-test)"><animate attributeName="width" values="0;0;118;118;0" keyTimes="0;.375;.45;.90;1" dur="10s" repeatCount="indefinite"/></rect><rect x="608" y="64" width="0" height="52" clip-path="url(#box-falsify)"><animate attributeName="width" values="0;0;118;118;0" keyTimes="0;.50;.575;.90;1" dur="10s" repeatCount="indefinite"/></rect><rect x="754" y="64" width="0" height="52" clip-path="url(#box-iterate)"><animate attributeName="width" values="0;0;118;118;0" keyTimes="0;.625;.70;.90;1" dur="10s" repeatCount="indefinite"/></rect></g>
    <text x="83" y="95">IDEA</text><text x="229" y="95">RESEARCH</text><text x="375" y="95">PROTOTYPE</text><text x="521" y="95">TEST</text><text x="667" y="95">FALSIFY</text><text x="813" y="95">ITERATE</text>
  </g>
  <g stroke="#ffca67" stroke-width="2" stroke-linecap="round" opacity=".34"><path d="M142 90h28m118 0h28m118 0h28m118 0h28m118 0h28"/></g>
  <g stroke="#ffe39a" stroke-width="3" stroke-linecap="round" fill="none"><path d="M142 90h28" stroke-dasharray="28" stroke-dashoffset="28"><animate attributeName="stroke-dashoffset" values="28;28;0;0;28" keyTimes="0;.10;.125;.90;1" dur="10s" repeatCount="indefinite"/></path><path d="M288 90h28" stroke-dasharray="28" stroke-dashoffset="28"><animate attributeName="stroke-dashoffset" values="28;28;0;0;28" keyTimes="0;.225;.25;.90;1" dur="10s" repeatCount="indefinite"/></path><path d="M434 90h28" stroke-dasharray="28" stroke-dashoffset="28"><animate attributeName="stroke-dashoffset" values="28;28;0;0;28" keyTimes="0;.35;.375;.90;1" dur="10s" repeatCount="indefinite"/></path><path d="M580 90h28" stroke-dasharray="28" stroke-dashoffset="28"><animate attributeName="stroke-dashoffset" values="28;28;0;0;28" keyTimes="0;.475;.50;.90;1" dur="10s" repeatCount="indefinite"/></path><path d="M726 90h28" stroke-dasharray="28" stroke-dashoffset="28"><animate attributeName="stroke-dashoffset" values="28;28;0;0;28" keyTimes="0;.60;.625;.90;1" dur="10s" repeatCount="indefinite"/></path></g>
  <text id="ship-label" x="886" y="95" fill="#ffca67" font-family="monospace" font-size="15"><animate attributeName="opacity" values=".45;.45;1;1;.45" keyTimes="0;.70;.725;.90;1" dur="10s" repeatCount="indefinite"/>→ SHIP</text>
</svg>
