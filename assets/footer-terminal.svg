<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 130" role="img" aria-labelledby="title desc">
  <title id="title">AUDRA terminal footer</title><desc id="desc">A command-center terminal line that resolves left-to-right, with a restrained decode sweep and blinking cursor.</desc>
  <defs>
    <clipPath id="command-reveal"><rect x="36" y="22" width="0" height="48"><animate attributeName="width" values="0;0;450;450;0" keyTimes="0;.06;.46;.82;1" dur="8s" repeatCount="indefinite"/></rect></clipPath>
    <linearGradient id="decode-sheen" x2="1"><stop stop-color="#7fffd0" stop-opacity="0"/><stop offset=".5" stop-color="#dffff3" stop-opacity=".85"/><stop offset="1" stop-color="#7fffd0" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="1000" height="130" rx="18" fill="#081513" stroke="#3cd8a2" stroke-width="2"/>
  <g font-family="monospace" font-size="18">
    <text x="42" y="54" fill="#75f4c5" opacity=".28">audra@command-center:~$ continue_building</text>
    <text x="42" y="54" fill="#dffff3" clip-path="url(#command-reveal)">audra@command-center:~$ continue_building</text>
    <rect x="30" y="28" width="54" height="22" fill="url(#decode-sheen)" opacity=".22" clip-path="url(#command-reveal)"><animate attributeName="x" values="30;480;30" keyTimes="0;.55;1" dur="8s" repeatCount="indefinite"/></rect>
    <text x="42" y="92" fill="#ffcf72">SYSTEM STATUS: ONLINE</text>
    <rect x="468" y="38" width="12" height="24" fill="#75f4c5"><animate attributeName="opacity" values="0;0;1;0;1;0" keyTimes="0;.46;.48;.58;.82;1" dur="8s" repeatCount="indefinite"/></rect>
  </g>
</svg>
